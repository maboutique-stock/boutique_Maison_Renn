/* ---------- Exports ---------- */

async function partagerFichier(nom, contenu, type) {
  const blob = new Blob([contenu], { type });
  let fichier = null;
  try { fichier = new File([blob], nom, { type }); } catch (e) { fichier = null; }
  // Sur iPad, la feuille de partage propose « Enregistrer dans Fichiers ».
  if (fichier && navigator.canShare && navigator.canShare({ files: [fichier] })) {
    try {
      await navigator.share({ files: [fichier], title: nom });
      return true;
    } catch (e) {
      if (e && e.name === 'AbortError') return false;
    }
  }
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nom;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 30000);
  return true;
}

const prefixe = () => normaliser(etat.reglages.nom || 'boutique').replace(/[^a-z0-9]+/g, '-').replace(/^-|-$/g, '') || 'boutique';
const argent = (n) => r2(n).toFixed(2).replace('.', ',');
const cellule = (v) => {
  const s = String(v ?? '');
  return /[;"\r\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
};
const versCSV = (lignes) => '﻿' + lignes.map((l) => l.map(cellule).join(';')).join('\r\n');

function exportJSON() {
  const donnees = {
    application: FORMAT_SAUVEGARDE, format: 1, version: VERSION, exporte: maintenant(),
    reglages: etat.reglages, articles: etat.articles, jours: etat.jours
  };
  partagerFichier(`${prefixe()}-sauvegarde-${auj()}.json`, JSON.stringify(donnees), 'application/json').then((ok) => {
    if (!ok) return;
    etat.meta.derniereSauvegarde = maintenant();
    sauverMeta();
    fermerModale();
    render();
    toast('Sauvegarde exportée.');
  });
}

function exportStock() {
  const lignes = [['Référence', 'Article', 'Catégorie', 'Prix d’achat', 'Coefficient', 'Prix de vente', 'Stock', 'Seuil d’alerte', 'Valeur d’achat', 'Valeur marchande', 'Statut']];
  [...etat.articles].sort(parNom).forEach((a) => {
    const p = pv(a);
    lignes.push([a.ref || '', a.nom, a.cat || '', argent(a.pa), argent(a.coef), argent(p), a.qte, a.seuil, argent(a.qte * a.pa), argent(a.qte * p), a.archive ? 'Archivé' : 'Actif']);
  });
  partagerFichier(`${prefixe()}-stock-${auj()}.csv`, versCSV(lignes), 'text/csv').then((ok) => { if (ok) toast('Stock exporté.'); });
}

function lignesVentes(jours) {
  const lignes = [['Date', 'Ticket', 'Heure', 'Paiement', 'Référence', 'Article', 'Quantité', 'Prix d’achat', 'Prix de vente', 'Montant', 'Statut']];
  [...jours].sort((a, b) => a.date.localeCompare(b.date)).forEach((j) => {
    const date = versDate(j.date).toLocaleDateString('fr-FR');
    j.tickets.forEach((t) => t.lignes.forEach((l) => {
      lignes.push([date, t.n, heure(t.h), MODE_LABEL[t.mode] || 'Autre', l.ref || '', l.nom, l.q, argent(l.pa), argent(l.pv), argent(l.pv * l.q), t.annule ? 'Annulé' : 'Valide']);
    }));
  });
  return lignes;
}

function exportVentes() {
  if (!etat.jours.length) { toast('Aucune vente à exporter pour l’instant.', true); return; }
  partagerFichier(`${prefixe()}-ventes-${auj()}.csv`, versCSV(lignesVentes(etat.jours)), 'text/csv').then((ok) => { if (ok) toast('Ventes exportées.'); });
}

function exportJour(date) {
  const j = jourDu(date);
  if (!j) return;
  partagerFichier(`${prefixe()}-journee-${date}.csv`, versCSV(lignesVentes([j])), 'text/csv').then((ok) => {
    if (!ok) return;
    fermerModale();
    toast('Journée exportée.');
  });
}

/* ---------- Restauration ---------- */

function restaurer(fichier) {
  const lecteur = new FileReader();
  lecteur.onload = () => {
    let d;
    try { d = JSON.parse(lecteur.result); } catch (e) { d = null; }
    if (!d || d.application !== FORMAT_SAUVEGARDE || !Array.isArray(d.articles) || !Array.isArray(d.jours) || typeof d.reglages !== 'object') {
      toast('Ce fichier n’est pas une sauvegarde de l’application.', true);
      return;
    }
    const quand = d.exporte ? `du ${dateLongue(dateLocale(new Date(d.exporte))).toLowerCase()} à ${heure(d.exporte)}` : 'choisie';
    confirmer({
      titre: 'Restaurer cette sauvegarde ?',
      texte: `Sauvegarde ${quand} : ${pl(d.articles.length, 'article')}, ${pl(d.jours.length, 'journée')} de vente. Toutes les données actuelles de cet iPad seront remplacées.`,
      ok: 'Remplacer les données',
      danger: true,
      action: async () => {
        etat.reglages = { ...REGLAGES_DEFAUT, ...d.reglages };
        etat.articles = d.articles;
        etat.jours = d.jours;
        etat.meta = { derniereSauvegarde: d.exporte || null };
        ui.caisse = { q: '', cat: 'Toutes', lignes: [], mode: null, message: '' };
        ui.q = '';
        ui.cat = 'Toutes';
        ui.jourSel = null;
        try {
          await Store.remplacerTout();
          toast('Sauvegarde restaurée.');
        } catch (e) {
          Store.echec(e);
        }
        render();
      }
    });
  };
  lecteur.onerror = () => toast('Lecture du fichier impossible.', true);
  lecteur.readAsText(fichier);
}

/* ---------- Actions ---------- */

const ACTIONS = {
  aller: (el) => aller(el.dataset.vue),
  'nouvel-article': () => ouvrirFiche(null),
  'ouvrir-article': (el) => ouvrirFiche(el.dataset.id),
  'puce-stock': (el) => {
    ui.cat = el.dataset.cat;
    $('#puces-stock').innerHTML = pucesStock();
    $('#liste-stock').innerHTML = lignesStock();
  },
  entree: () => dialogueEntree(),
  'valider-entree': () => {
    const a = article($('#entree-article').value);
    const q = lireEntier($('#entree-qte').value);
    if (!a) return;
    if (q <= 0) { toast('Indiquez une quantité reçue supérieure à zéro.', true); return; }
    a.qte += q;
    a.maj = maintenant();
    sauverArticles();
    fermerModale();
    render();
    toast(`${q} × « ${a.nom} » ajouté${q > 1 ? 's' : ''} au stock.`);
  },
  pas: (el) => {
    const champ = el.dataset.champ;
    ui.fiche[champ] = Math.max(0, (ui.fiche[champ] || 0) + Number(el.dataset.sens));
    vue.querySelector(`input[data-champ="${champ}"]`).value = ui.fiche[champ];
    majFiche();
  },
  'enregistrer-article': () => enregistrerArticle(),
  archiver: () => {
    const a = article(ui.fiche.id);
    if (!a) return;
    a.archive = !a.archive;
    a.maj = maintenant();
    if (a.archive) {
      ui.caisse.lignes = ui.caisse.lignes.filter((l) => l.id !== a.id);
      sauverBrouillon();
    }
    sauverArticles();
    toast(a.archive ? 'Article archivé.' : 'Article réactivé.');
    aller('stock');
  },
  'supprimer-article': () => {
    const a = article(ui.fiche.id);
    if (!a) return;
    confirmer({
      titre: 'Supprimer cet article ?',
      texte: `« ${a.nom} » n’a jamais été vendu : il sera supprimé définitivement.`,
      ok: 'Supprimer',
      danger: true,
      action: () => {
        etat.articles = etat.articles.filter((x) => x.id !== a.id);
        ui.caisse.lignes = ui.caisse.lignes.filter((l) => l.id !== a.id);
        sauverBrouillon();
        sauverArticles();
        toast('Article supprimé.');
        aller('stock');
      }
    });
  },
  'ouvrir-jour': () => {
    const date = auj();
    if (jourOuvert() || jourDu(date)) { render(); return; }
    const j = { date, ouverture: maintenant(), cloture: null, tickets: [] };
    etat.jours.push(j);
    sauverJour(j);
    ui.caisse.message = '';
    render();
  },
  'rouvrir-jour': () => {
    const j = jourDu(auj());
    if (!j || jourOuvert()) return;
    confirmer({
      titre: 'Rouvrir la journée ?',
      texte: `${dateLongue(j.date)} : vous pourrez de nouveau y enregistrer des tickets. Pensez à la clôturer ensuite.`,
      ok: 'Rouvrir la journée',
      action: () => { j.cloture = null; sauverJour(j); render(); }
    });
  },
  'puce-caisse': (el) => {
    ui.caisse.cat = el.dataset.cat;
    $('#puces-caisse').innerHTML = pucesCaisse();
    $('#tuiles').innerHTML = tuiles();
  },
  ajouter: (el) => ajouterAuTicket(el.dataset.id),
  retirer: (el) => retirerDuTicket(el.dataset.id),
  mode: (el) => {
    ui.caisse.mode = el.dataset.mode;
    sauverBrouillon();
    majCaisse();
  },
  'vider-ticket': () => {
    ui.caisse.lignes = [];
    ui.caisse.mode = null;
    ui.caisse.message = '';
    sauverBrouillon();
    majCaisse();
  },
  'valider-ticket': () => validerTicket(),
  'voir-jour': (el) => { ui.jourSel = el.dataset.date; aller('journees'); },
  'choisir-jour': (el) => { ui.jourSel = el.dataset.date; render(); },
  'demander-cloture': (el) => demanderCloture(el.dataset.date),
  'annuler-ticket': (el) => annulerTicket(el.dataset.date, Number(el.dataset.n)),
  'export-json': () => exportJSON(),
  'export-stock': () => exportStock(),
  'export-ventes': () => exportVentes(),
  'export-jour': (el) => exportJour(el.dataset.date),
  rappel: () => { etat.reglages.rappel = !etat.reglages.rappel; sauverReglages(); render(); },
  'coef-defaut': (el) => {
    etat.reglages.coef = Math.max(1, r2(etat.reglages.coef + 0.05 * Number(el.dataset.sens)));
    sauverReglages();
    render();
  },
  arrondi: (el) => {
    etat.reglages.arrondi = Number(el.dataset.v);
    sauverReglages();
    render();
    toast('Arrondi appliqué à tous les prix de vente.');
  },
  'choisir-restauration': () => {
    const input = $('#fichier-restauration');
    input.value = '';
    input.click();
  },
  'fermer-modale': () => fermerModale(),
  'confirmer-modale': () => {
    const action = ui.actionModale;
    fermerModale();
    if (action) action();
  },
  maj: () => {
    if (ui.regMaj && ui.regMaj.waiting) {
      ui.majDemandee = true;
      ui.regMaj.waiting.postMessage('activer');
    } else {
      location.reload();
    }
  }
};

let minuterieNom = null;
const SAISIES = {
  'recherche-stock': (el) => { ui.q = el.value; $('#liste-stock').innerHTML = lignesStock(); },
  'recherche-caisse': (el) => { ui.caisse.q = el.value; $('#tuiles').innerHTML = tuiles(); },
  fiche: (el) => {
    const champ = el.dataset.champ;
    if (champ === 'qte' || champ === 'seuil') ui.fiche[champ] = lireEntier(el.value);
    else ui.fiche[champ] = el.value;
    el.closest('.champ') && el.closest('.champ').classList.remove('erreur');
    if (champ === 'nom') $('#fiche-titre').textContent = el.value.trim() || (ui.fiche.id ? 'Article' : 'Nouvel article');
    if (champ !== 'nom' && champ !== 'ref' && champ !== 'cat') majFiche();
  },
  'nom-boutique': (el) => {
    etat.reglages.nom = el.value;
    clearTimeout(minuterieNom);
    minuterieNom = setTimeout(sauverReglages, 400);
    renderNav();
  }
};

document.addEventListener('click', (e) => {
  if (e.target === modale) { fermerModale(); return; }
  const el = e.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const action = ACTIONS[el.dataset.action];
  if (action) action(el, e);
});
document.addEventListener('input', (e) => {
  const el = e.target.closest('[data-input]');
  if (el && SAISIES[el.dataset.input]) SAISIES[el.dataset.input](el);
});
$('#fichier-restauration').addEventListener('change', (e) => {
  const f = e.target.files && e.target.files[0];
  if (f) restaurer(f);
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape' && !modale.hidden) fermerModale();
});
// Le jour peut changer pendant que l’application reste ouverte.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && (ui.vue === 'vente' || ui.vue === 'journees')) render();
});

/* ---------- Mise à jour hors ligne (service worker) ---------- */

function enregistrerServiceWorker() {
  if (!('serviceWorker' in navigator) || location.protocol === 'file:') return;
  navigator.serviceWorker.register('sw.js').then((reg) => {
    const signaler = () => { ui.regMaj = reg; majEl.hidden = false; };
    if (reg.waiting && navigator.serviceWorker.controller) signaler();
    reg.addEventListener('updatefound', () => {
      const nouveau = reg.installing;
      if (!nouveau) return;
      nouveau.addEventListener('statechange', () => {
        if (nouveau.state === 'installed' && navigator.serviceWorker.controller) signaler();
      });
    });
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') reg.update().catch(() => {});
    });
  }).catch(() => {});
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (ui.majDemandee) location.reload();
  });
}

/* ---------- Démarrage ---------- */

async function demarrer() {
  await Store.ouvrir();
  let d = {};
  try { d = await Store.charger(); } catch (e) { toast('Lecture des données impossible.', true); }
  etat.reglages = { ...REGLAGES_DEFAUT, ...(d.reglages || {}) };
  etat.articles = d.articles || [];
  etat.jours = d.jours || [];
  etat.meta = { derniereSauvegarde: null, ...(d.meta || {}) };
  if (d.brouillon && Array.isArray(d.brouillon.lignes)) {
    ui.caisse.lignes = d.brouillon.lignes.filter((l) => article(l.id));
    ui.caisse.mode = d.brouillon.mode || null;
  }
  ui.vue = jourOuvert() ? 'vente' : 'stock';
  render();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {});
  enregistrerServiceWorker();
}

demarrer();
})();
</script>
